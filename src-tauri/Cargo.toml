[package]
name = "ruibotte-shell"
# 버전 정본은 tauri.conf.json — scripts/set-version.mjs 가 여기와 package.json 을 함께 맞춘다
version = "0.1.0"
description = "RuiBotte Shell"
authors = ["RuiFoot"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "ruibotte_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
rusqlite = { version = "0.41", features = ["bundled"] }
window-vibrancy = "0.6"
anyhow = "1"
russh = { version = "0.65", default-features = false, features = ["flate2", "ring", "rsa", "des", "dsa"] }
russh-sftp = "3"
keyring = "4"
encoding_rs = "0.8.35"
chardetng = "1.0.0"
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "io-util", "fs"] }
tauri-plugin-dialog = "2"
trash = "5"
urlencoding = "2"

[profile.release]
# 설치 크기·기동 우선
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
winreg = "0.55"
