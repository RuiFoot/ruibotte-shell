[package]
name = "ruibotte-shell"
# 버전 정본은 tauri.conf.json — scripts/set-version.mjs 가 여기와 package.json 을 함께 맞춘다
version = "0.15.1"
description = "RuiBotte Shell"
authors = ["RuiFoot"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "ruibotte_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
rusqlite = { version = "0.41", features = ["bundled"] }
window-vibrancy = "0.6"
anyhow = "1"
russh = { version = "0.65", default-features = false, features = ["flate2", "ring", "rsa", "des", "dsa"] }
russh-sftp = "3"
keyring = "4"
encoding_rs = "0.8.35"
chardetng = "1.0.0"
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "io-util", "fs", "net", "process"] }
tauri-plugin-dialog = "2"
trash = "5"
urlencoding = "2"
tokio-postgres = { version = "0.7", features = ["runtime"] }
mysql_async = { version = "0.37.1", default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "tls12"] }
futures-util = "0.3"
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rustls", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
tar = "0.4"
flate2 = "1"
time = "0.3"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
tokio-postgres-rustls = { version = "0.13", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
sqlparser = { version = "0.64.0", default-features = false, features = ["std", "visitor"] }

[profile.release]
# 설치 크기·기동 우선
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# 앱 전체는 크기 우선(s)이지만, 매 바이트를 지나는 암호·압축·해시는 속도 우선(3) — SSH 처리량·전송 sha256
[profile.release.package.ring]
opt-level = 3
[profile.release.package.russh]
opt-level = 3
[profile.release.package.russh-cryptovec]
opt-level = 3
[profile.release.package.sha2]
opt-level = 3
[profile.release.package.aes]
opt-level = 3
[profile.release.package.ctr]
opt-level = 3
[profile.release.package.chacha20]
opt-level = 3
[profile.release.package.poly1305]
opt-level = 3
[profile.release.package.ghash]
opt-level = 3
[profile.release.package.miniz_oxide]
opt-level = 3

[target."cfg(windows)".dependencies]
winreg = "0.55"
# 망 판별(기본 게이트웨이·DNS 접미사·Wi-Fi 이름) — 이미 의존성 트리에 있는 판
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WiFi", "Win32_Networking_WinSock"] }
