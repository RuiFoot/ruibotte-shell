# develop·main push 와 PR 마다: 버전 일치·화면 타입 검사·빌드·Rust 검사(Windows·macOS)
name: ci

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Version
        run: node scripts/check-version.mjs

      - name: CSS
        run: node scripts/check-css.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # JDBC 브리지 소스가 Java 11 대상으로 컴파일되는지(배포 jar 는 저장소의 src-tauri/resources/rb-jdbc.jar)
      - name: JDBC sidecar
        shell: bash
        run: |
          mkdir -p /tmp/rbj && javac --release 11 -encoding UTF-8 -d /tmp/rbj sidecar/RbJdbc.java

      - name: Frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust
        working-directory: src-tauri
        run: cargo clippy --locked -- -D warnings
